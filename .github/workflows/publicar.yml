name: Atualizar dados e publicar site

on:
  schedule:
    - cron: "0 6 5 * *"   # todo dia 5, às 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "notebooks/**", "referencia/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Só o Parquet convertido e o IBGE: com o Parquet em dia, os .dbc nem são baixados.
      - name: Restaurar cache dos dados
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/parquet
            cache/raw/ibge
          key: datasus-${{ github.run_id }}
          restore-keys: datasus-

      - name: Instalar dependências
        run: uv sync --all-groups

      - name: Baixar e converter dados (incremental)
        run: uv run epidados preparar

      # Salva logo após o download, mesmo que uma etapa seguinte falhe.
      - name: Salvar cache dos dados
        uses: actions/cache/save@v4
        with:
          path: |
            cache/parquet
            cache/raw/ibge
          key: datasus-${{ github.run_id }}

      - name: Malhas, agregações e datasets
        run: |
          uv run epidados malhas
          uv run epidados agregar
          uv run epidados ml

      - name: Testes de validação
        run: uv run pytest -q

      - name: Gerar site
        run: uv run quarto render site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
