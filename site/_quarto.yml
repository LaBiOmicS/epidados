project:
  type: website
  output-dir: _site
  resources:
    - dados/**
    - dados-ia/arquivos/**

lang: pt-BR

website:
  title: "EpiDados"
  favicon: tema/logo.svg
  description: "Dados reais do DATASUS para ensinar saúde e ciência de dados"
  page-navigation: true
  navbar:
    logo:
      path: tema/logo.svg
      alt: "EpiDados"
    left:
      - href: index.qmd
        text: Início
      - text: Estudos de caso
        menu:
          - href: casos/index.qmd
            text: "Visão geral"
          - href: casos/leishmaniose.qmd
            text: "Leishmaniose visceral"
          - href: casos/leptospirose.qmd
            text: "Leptospirose"
          - href: casos/raiva.qmd
            text: "Raiva e atendimento antirrábico"
      - text: Dados para IA
        menu:
          - href: dados-ia/index.qmd
            text: "Todos os datasets"
          - href: dados-ia/leishmaniose-obito.qmd
            text: "Óbito por leishmaniose: ficha técnica"
          - href: dados-ia/leishmaniose-analise.qmd
            text: "Óbito por leishmaniose: análise comentada"
      - href: metodologia.qmd
        text: Metodologia
  page-footer:
    left: "Dados: SINAN/DATASUS e IBGE. Material didático, não usar para decisões clínicas."
    right: "Código MIT · Textos e dados CC BY 4.0"

format:
  html:
    theme:
      light: [cosmo, tema/claro.scss]
      dark: [darkly, tema/escuro.scss]
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-title: "Nesta página"
    smooth-scroll: true
    code-tools: false
